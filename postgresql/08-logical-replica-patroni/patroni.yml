-- change NOME and IP according to ETCD.conf
sudo mkdir -p /etc/patroni
sudo tee /etc/patroni/patroni.yml <<'EOF'
scope: lab
name: NOME

restapi:
  listen: 0.0.0.0:8008
  connect_address: IP:8008

etcd3:
  hosts: 192.168.56.11:2379,192.168.56.12:2379,192.168.56.13:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_log_hints: "on"
  initdb:
    - encoding: UTF8
    - data-checksums

postgresql:
  listen: 0.0.0.0:5432
  connect_address: IP:5432
  data_dir: /var/lib/pgsql/18/data
  bin_dir: /usr/pgsql-18/bin
  pgpass: /tmp/pgpass0
  authentication:
    superuser:
      username: postgres
      password: SENHA_POSTGRES
    replication:
      username: replicador
      password: repl123
    rewind:
      username: postgres
      password: SENHA_POSTGRES
  pg_hba:
    - local all all peer
    - host replication replicador 192.168.56.0/24 scram-sha-256
    - host all all 192.168.56.0/24 scram-sha-256
    - host all all 127.0.0.1/32 scram-sha-256
  parameters:
    unix_socket_directories: /run/postgresql

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
EOF
sudo chown -R postgres: /etc/patroni && sudo chmod 600 /etc/patroni/patroni.yml
