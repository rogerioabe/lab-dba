---
- name: Instalar PostgreSQL e Patroni
  ansible.builtin.dnf:
    name:
      - "postgresql{{ pg_version }}-server"
      - "postgresql{{ pg_version }}-contrib"
      - "pgvector_{{ pg_version }}"
      - patroni
      - patroni-etcd
    state: present
    enablerepo: pgdg-rhel9-extras

- name: Postgres parado e desabilitado
  ansible.builtin.systemd:
    name: postgresql-{{ pg_version }}
    state: stopped
    enabled: false

- name: Diretório de configuração do Patroni
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Configurar Patroni
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "600"
    backup: true
  diff: false
  notify: Reload Patroni

- name: Pasta de ajustes do systemd para o Patroni
  ansible.builtin.file:
    path: /etc/systemd/system/patroni.service.d
    state: directory
    mode: "0755"

- name: Patroni espera o etcd e se religa sozinho
  ansible.builtin.copy:
    dest: /etc/systemd/system/patroni.service.d/restart.conf
    content: |
      # Managed by Ansible. At boot etcd may not have quorum yet and Patroni exits:
      # start after the local etcd and keep retrying. A manual "systemctl stop" is not restarted.
      [Unit]
      After=etcd.service
      StartLimitIntervalSec=0

      [Service]
      Restart=always
      RestartSec=10
    mode: "0644"
  notify: Recarregar systemd

- name: Patroni habilitado e ativo
  ansible.builtin.systemd:
    name: patroni
    state: started
    enabled: true

- name: Resposta API
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ patroni_api_port }}/health"
  register: _result
  until: _result.status == 200
  retries: 30
  delay: 10
  check_mode: false
