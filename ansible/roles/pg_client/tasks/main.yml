---
- name: Repositório oficial PGDG
  ansible.builtin.dnf:
    name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
    state: present
    disable_gpg_check: true

- name: Desabilitar o módulo postgresql do Rocky
  ansible.builtin.command: dnf -qy module disable postgresql
  register: _modulo
  changed_when: "'Disabling' in _modulo.stdout"

- name: Cliente PostgreSQL (psql, pg_dump)
  ansible.builtin.dnf:
    name: "postgresql{{ pg_version }}"
    state: present
