# Variáveis do cluster PostgreSQL/Patroni.
# Secrets live in vault.yml; this file only holds plain aliases to them.
patroni_scope: lab
patroni_replication_user: replicador
patroni_superuser_password: "{{ vault_patroni_superuser_password }}"
patroni_replication_password: "{{ vault_patroni_replication_password }}"
postgres_password: "{{ patroni_superuser_password }}"


pg_users:
  - name: app_user
    password: "{{ vault_app_user_password }}"
  - name: app_ro

pg_databases:
  - name: appdb
    owner: app_user

# Privileges for each role, applied by db_objects.yml (one item = one GRANT).
pg_privileges:
  - db: appdb
    type: database
    objs: appdb
    privs: CONNECT
    roles: app_ro
  - db: appdb
    type: schema
    objs: public
    privs: USAGE
    roles: app_ro
  - db: appdb
    type: table
    objs: ALL_IN_SCHEMA
    schema: public
    privs: SELECT
    roles: app_ro
  - db: appdb
    type: default_privs
    objs: TABLES
    schema: public
    privs: SELECT
    roles: app_ro
    target_roles: app_user
