---
- name: Find the Patroni leader
  hosts: postgres
  gather_facts: false
  tasks:
    - name: Ask Patroni if this node is the primary
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/primary"
        status_code: [200, 503]
      register: _primary

    - name: Group nodes by role
      ansible.builtin.group_by:
        key: "patroni_{{ 'primary' if _primary.status == 200 else 'replica' }}"

- name: Set the new passwords in PostgreSQL (on the primary)
  hosts: patroni_primary
  gather_facts: false
  tasks:
    - name: Python driver for the community.postgresql modules
      ansible.builtin.dnf:
        name: python3-psycopg2
        state: present

    - name: New password for postgres and the replication user
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        login_unix_socket: /run/postgresql
        login_db: postgres
      become: true
      become_user: postgres
      loop:
        - name: postgres
          password: "{{ patroni_superuser_password }}"
        - name: "{{ patroni_replication_user }}"
          password: "{{ patroni_replication_password }}"
      no_log: true

- name: Rewrite patroni.yml and reload Patroni, one node at a time
  ansible.builtin.import_playbook: cluster.yml

- name: Validate the cluster with the new passwords
  ansible.builtin.import_playbook: validate.yml
