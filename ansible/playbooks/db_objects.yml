---
- name: Databases, Users and Privileges
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: 
    - ../inventory/group_vars/postgres/vault.yml
    - ../inventory/group_vars/postgres/vars.yml

  vars:
    pg_host: 127.0.0.1
    pg_port: 5000

  tasks:
    - name: Create users from pg_users
      community.postgresql.postgresql_user:
        name: "{{ item.name }}"
        password: "{{ item.password | default(omit) }}"
        no_password_changes: true
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: postgres
        login_password: "{{ postgres_password }}"
      loop: "{{ pg_users }}"
      no_log: true

    - name: Create databases from pg_databases
      community.postgresql.postgresql_db:
        name: "{{ item.name }}"
        owner: "{{ item.owner }}"
        state: present
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: postgres
        login_password: "{{ postgres_password }}"
      loop: "{{ pg_databases }}"

    - name: GRANT CONNECT on appdb to app_ro
      community.postgresql.postgresql_privs:
        login_db: appdb
        type: database
        objs: appdb
        privs: CONNECT
        roles: app_ro
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: postgres
        login_password: "{{ postgres_password }}"

    - name: GRANT USAGE on schema public TO app_ro
      community.postgresql.postgresql_privs:
        login_db: appdb
        type: schema
        objs: public
        privs: USAGE
        roles: app_ro
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: postgres
        login_password: "{{ postgres_password }}"

    - name: GRANT SELECT ALL TABLE in schema public TO app_ro
      community.postgresql.postgresql_privs:
        login_db: appdb
        type: table
        objs: ALL_IN_SCHEMA
        schema: public
        privs: SELECT
        roles: app_ro
        login_host: "{{ pg_host }}"
        login_port: "{{ pg_port }}"
        login_user: postgres
        login_password: "{{ postgres_password }}"
